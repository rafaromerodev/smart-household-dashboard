name: Reset public demo

# Restores the demo household every night so visitors' changes don't accumulate.
# Runs only on schedule or by hand: never on pull requests, so forks can't reach the secrets.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    if: github.repository == 'rafaromerodev/smart-household-dashboard'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reset demo data
        run: node scripts/demo-seed.mjs
        env:
          SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DEMO_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEMO_SUPABASE_SERVICE_ROLE_KEY }}
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
